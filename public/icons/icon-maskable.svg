<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#C47040"/>
      <stop offset="100%" stop-color="#6B3018"/>
    </radialGradient>
    <radialGradient id="shine" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <!-- Full bleed background (maskable — safe zone is centre 80%) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shine)"/>
  <!-- Piggy body — shifted slightly down/center for safe zone -->
  <ellipse cx="256" cy="302" rx="138" ry="118" fill="rgba(255,255,255,0.93)"/>
  <!-- Head -->
  <circle cx="356" cy="210" r="70" fill="rgba(255,255,255,0.93)"/>
  <!-- Snout -->
  <ellipse cx="388" cy="230" rx="32" ry="25" fill="#D4845A"/>
  <circle cx="377" cy="234" r="7" fill="rgba(255,255,255,0.7)"/>
  <circle cx="399" cy="234" r="7" fill="rgba(255,255,255,0.7)"/>
  <!-- Eye -->
  <circle cx="336" cy="186" r="9" fill="#5C2E10"/>
  <circle cx="339" cy="183" r="3" fill="rgba(255,255,255,0.7)"/>
  <!-- Ear -->
  <ellipse cx="320" cy="146" rx="20" ry="25" fill="rgba(255,255,255,0.93)"/>
  <ellipse cx="320" cy="148" rx="12" ry="15" fill="#ECA882"/>
  <!-- Coin slot -->
  <rect x="228" y="148" width="52" height="10" rx="5" fill="#7A3A18" opacity="0.6"/>
  <!-- Legs -->
  <rect x="162" y="385" width="40" height="44" rx="16" fill="rgba(255,255,255,0.90)"/>
  <rect x="216" y="389" width="40" height="40" rx="16" fill="rgba(255,255,255,0.90)"/>
  <rect x="282" y="389" width="40" height="40" rx="16" fill="rgba(255,255,255,0.90)"/>
  <rect x="336" y="385" width="40" height="44" rx="16" fill="rgba(255,255,255,0.90)"/>
</svg>
