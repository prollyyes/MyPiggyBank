<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#C47040"/>
      <stop offset="100%" stop-color="#6B3018"/>
    </radialGradient>
    <radialGradient id="shine" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>
  <!-- Piggy body -->
  <ellipse cx="248" cy="292" rx="154" ry="132" fill="rgba(255,255,255,0.93)"/>
  <!-- Head -->
  <circle cx="356" cy="198" r="78" fill="rgba(255,255,255,0.93)"/>
  <!-- Snout -->
  <ellipse cx="390" cy="220" rx="36" ry="28" fill="#D4845A"/>
  <circle cx="378" cy="224" r="8" fill="rgba(255,255,255,0.7)"/>
  <circle cx="402" cy="224" r="8" fill="rgba(255,255,255,0.7)"/>
  <!-- Eye -->
  <circle cx="334" cy="174" r="10" fill="#5C2E10"/>
  <circle cx="337" cy="171" r="3" fill="rgba(255,255,255,0.7)"/>
  <!-- Ear -->
  <ellipse cx="316" cy="130" rx="22" ry="28" fill="rgba(255,255,255,0.93)"/>
  <ellipse cx="316" cy="132" rx="13" ry="17" fill="#ECA882"/>
  <!-- Coin slot -->
  <rect x="216" y="130" width="58" height="11" rx="5.5" fill="#7A3A18" opacity="0.6"/>
  <!-- Legs -->
  <rect x="148" y="384" width="46" height="52" rx="18" fill="rgba(255,255,255,0.90)"/>
  <rect x="208" y="388" width="46" height="46" rx="18" fill="rgba(255,255,255,0.90)"/>
  <rect x="284" y="388" width="46" height="46" rx="18" fill="rgba(255,255,255,0.90)"/>
  <rect x="344" y="384" width="46" height="52" rx="18" fill="rgba(255,255,255,0.90)"/>
  <!-- Tail -->
  <path d="M 94 272 C 58 252 64 204 90 188 C 116 172 118 142 98 126"
    stroke="rgba(255,255,255,0.88)" stroke-width="17" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
